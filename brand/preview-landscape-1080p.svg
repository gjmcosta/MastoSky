  <text id="tagline" class="ms-tagline" x="960" y="655" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="400" letter-spacing="0.01em" fill="#A9B0D6">One sky for Mastodon and Bluesky</text>
</svg>
