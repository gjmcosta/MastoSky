    <circle class="ms-bg-b" cx="420" cy="690" r="1.2"/>
    <circle class="ms-bg-c" cx="1470" cy="610" r="1.8"/>
    <circle class="ms-bg-a" cx="1620" cy="705" r="1.3"/>
    <circle class="ms-bg-b" cx="1790" cy="625" r="2.2"/>
    <circle class="ms-bg-c" cx="165" cy="875" r="2.0"/>
    <circle class="ms-bg-a" cx="365" cy="955" r="1.4"/>
    <circle class="ms-bg-b" cx="545" cy="860" r="1.6"/>
    <circle class="ms-bg-c" cx="715" cy="968" r="2.2"/>
    <circle class="ms-bg-a" cx="895" cy="885" r="1.2"/>
    <circle class="ms-bg-b" cx="1075" cy="940" r="1.8"/>
    <circle class="ms-bg-c" cx="1265" cy="870" r="1.4"/>
    <circle class="ms-bg-a" cx="1440" cy="975" r="2.1"/>
    <circle class="ms-bg-b" cx="1635" cy="895" r="1.2"/>
    <circle class="ms-bg-c" cx="1785" cy="948" r="1.6"/>
    <circle class="ms-bg-a" cx="845" cy="240" r="1.4"/>
    <circle class="ms-bg-b" cx="1080" cy="268" r="1.2"/>
    <circle class="ms-bg-c" cx="1370" cy="285" r="1.6"/>
    <circle class="ms-bg-a" cx="620" cy="790" r="1.3"/>
    <circle class="ms-bg-b" cx="980" cy="810" r="1.5"/>
    <circle class="ms-bg-c" cx="1310" cy="785" r="1.2"/>
  </g>

  <rect width="1920" height="1080" fill="url(#ms-vignette)"/>

  <g id="lockup" transform="translate(628.75 425) scale(1.25)">
    <g id="symbol">
      <g id="symbol-lines" fill="none" stroke="#8F96FF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <path class="ms-line ms-l1" pathLength="1" d="M40 40 L62 24 L104 20 L138 34 L148 62 L146 106"/>
        <path class="ms-line ms-l2" pathLength="1" d="M148 62 L124 76 L98 76 L78 76 L58 68 L42 56 L40 40"/>
