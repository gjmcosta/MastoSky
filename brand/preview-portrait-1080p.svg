<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920" role="img">
  <title>MastoSky — Full HD Preview (Portrait 9:16)</title>
  <desc>Full HD 1080x1920 vertical editorial night-sky frame with the animated MastoSky constellation lockup.</desc>
  <defs>
    <radialGradient id="ms-cosmos-indigo" cx="30%" cy="28%" r="65%">
      <stop offset="0%" stop-color="#5B4BDB" stop-opacity="0.18"/>
      <stop offset="55%" stop-color="#5B4BDB" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#0B1020" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ms-cosmos-sky" cx="76%" cy="72%" r="62%">
      <stop offset="0%" stop-color="#4DB2FF" stop-opacity="0.12"/>
      <stop offset="50%" stop-color="#4DB2FF" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#0B1020" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ms-vignette" cx="50%" cy="50%" r="74%">
      <stop offset="0%" stop-color="#050710" stop-opacity="0"/>
      <stop offset="65%" stop-color="#050710" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#050710" stop-opacity="0.54"/>
    </radialGradient>
  </defs>
  <style>
    .ms-bg-a { animation: ms-twinkle 4.4s ease-in-out 0.0s infinite alternate; }
    .ms-bg-b { animation: ms-twinkle 5.3s ease-in-out 1.1s infinite alternate; }
    .ms-bg-c { animation: ms-twinkle 6.2s ease-in-out 2.2s infinite alternate; }

    .ms-star {
      transform-box: fill-box;
      transform-origin: center;
      animation: ms-star-pop 0.36s cubic-bezier(0.16, 1, 0.3, 1) both;
    }
    .ms-s1 { animation-delay: 0.00s; }
    .ms-s2 { animation-delay: 0.12s; }
    .ms-s3 { animation-delay: 0.24s; }
    .ms-s4 { animation-delay: 0.36s; }

    .ms-line, .ms-wl {
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
      animation: ms-draw-line cubic-bezier(0.16, 1, 0.3, 1) both;
    }
    .ms-l1 { animation-duration: 0.78s; animation-delay: 0.22s; }
    .ms-l2 { animation-duration: 0.78s; animation-delay: 0.46s; }
    .ms-l3 { animation-duration: 0.38s; animation-delay: 0.68s; }
    .ms-l4 { animation-duration: 0.38s; animation-delay: 0.78s; }
    .ms-l5 { animation-duration: 0.38s; animation-delay: 0.88s; }
    .ms-l6 { animation-duration: 0.45s; animation-delay: 0.96s; }
    .ms-l7 { animation-duration: 0.52s; animation-delay: 1.02s; }
    .ms-l8 { animation-duration: 0.52s; animation-delay: 1.12s; }

    .ms-wl { animation-duration: 0.55s; }
    .ms-w1 { animation-delay: 0.85s; }
    .ms-w2 { animation-delay: 0.93s; }
    .ms-w3 { animation-delay: 1.01s; }
    .ms-w4 { animation-delay: 1.09s; }
    .ms-w5 { animation-delay: 1.17s; }
    .ms-w6 { animation-delay: 1.29s; }
    .ms-w7 { animation-delay: 1.37s; }
    .ms-w8 { animation-delay: 1.45s; }

    .ms-tagline {
      animation: ms-tagline-rise 0.75s cubic-bezier(0.16, 1, 0.3, 1) 1.85s both;
    }

    .ms-eye {
      transform-box: fill-box;
      transform-origin: center;
      animation: ms-eye-ignite 0.60s cubic-bezier(0.16, 1, 0.3, 1) 2.15s both;
    }

    @keyframes ms-twinkle {
      0% { opacity: 0.18; }
      100% { opacity: 0.62; }
    }
    @keyframes ms-star-pop {
      0% { opacity: 0; transform: scale(0.35); }
      100% { opacity: 1; transform: scale(1); }
    }
    @keyframes ms-draw-line {
      0% { stroke-dashoffset: 1; opacity: 0; }
      4% { opacity: 1; }
      100% { stroke-dashoffset: 0; opacity: 1; }
    }
    @keyframes ms-tagline-rise {
      0% { opacity: 0; transform: translateY(6px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    @keyframes ms-eye-ignite {
      0% { opacity: 0; transform: scale(0); }
      65% { opacity: 1; transform: scale(1.18); }
      100% { opacity: 1; transform: scale(1); }
    }

    @media (prefers-reduced-motion: reduce) {
      .ms-bg-a, .ms-bg-b, .ms-bg-c {
        animation: none !important;
        opacity: 0.40 !important;
      }
      .ms-star, .ms-line, .ms-wl, .ms-tagline, .ms-eye {
        animation: none !important;
        opacity: 1 !important;
        stroke-dashoffset: 0 !important;
        transform: none !important;
      }
    }
  </style>

  <rect id="background" width="1080" height="1920" fill="#0B1020"/>
  <rect width="1080" height="1920" fill="url(#ms-cosmos-indigo)"/>
  <rect width="1080" height="1920" fill="url(#ms-cosmos-sky)"/>

