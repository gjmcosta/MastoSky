    <circle class="ms-bg-b" cx="185" cy="1210" r="1.8"/>
    <circle class="ms-bg-c" cx="430" cy="1185" r="1.2"/>
    <circle class="ms-bg-a" cx="695" cy="1235" r="2.1"/>
    <circle class="ms-bg-b" cx="910" cy="1195" r="1.4"/>
    <circle class="ms-bg-c" cx="140" cy="1415" r="1.3"/>
    <circle class="ms-bg-a" cx="385" cy="1365" r="2.0"/>
    <circle class="ms-bg-b" cx="620" cy="1440" r="1.5"/>
    <circle class="ms-bg-c" cx="865" cy="1390" r="1.2"/>
    <circle class="ms-bg-a" cx="985" cy="1510" r="2.2"/>
    <circle class="ms-bg-b" cx="235" cy="1610" r="1.6"/>
    <circle class="ms-bg-c" cx="510" cy="1585" r="1.2"/>
    <circle class="ms-bg-a" cx="775" cy="1645" r="1.8"/>
    <circle class="ms-bg-b" cx="130" cy="1785" r="2.1"/>
    <circle class="ms-bg-c" cx="395" cy="1755" r="1.4"/>
    <circle class="ms-bg-a" cx="655" cy="1810" r="1.3"/>
    <circle class="ms-bg-b" cx="915" cy="1765" r="2.0"/>
  </g>

  <rect width="1080" height="1920" fill="url(#ms-vignette)"/>

  <g id="lockup" transform="translate(248.5 855) scale(1.10)">
    <g id="symbol">
      <g id="symbol-lines" fill="none" stroke="#8F96FF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <path class="ms-line ms-l1" pathLength="1" d="M40 40 L62 24 L104 20 L138 34 L148 62 L146 106"/>
        <path class="ms-line ms-l2" pathLength="1" d="M148 62 L124 76 L98 76 L78 76 L58 68 L42 56 L40 40"/>
