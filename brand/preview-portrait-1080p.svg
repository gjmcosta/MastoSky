      </g>
      <g id="symbol-stars" fill="#FFFFFF">
        <circle class="ms-star ms-s1" cx="62" cy="24" r="5"/>
        <circle class="ms-star ms-s1" cx="104" cy="20" r="5"/>
        <circle class="ms-star ms-s1" cx="10" cy="38" r="5"/>
