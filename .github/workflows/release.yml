name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
          - os: windows-latest
            platform: windows
          - os: ubuntu-latest
            platform: linux

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build macOS app
        if: matrix.platform == 'macos'
        run: |
          pyinstaller --noconfirm --clean --windowed --onedir \
            --name MastoSky \
            --osx-bundle-identifier io.github.gjmcosta.mastosky \
            --add-data "index.html:." \
            --add-data "app.js:." \
            --add-data "app.css:." \
            --add-data "manifest.json:." \
            --add-data "brand:brand" \
            --add-data "vendor:vendor" \
            app.py
          ditto -c -k --sequesterRsrc --keepParent dist/MastoSky.app MastoSky-macOS.zip

      - name: Build Windows app
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onedir `
            --name MastoSky `
            --add-data "index.html;." `
            --add-data "app.js;." `
            --add-data "app.css;." `
            --add-data "manifest.json;." `
            --add-data "brand;brand" `
            --add-data "vendor;vendor" `
            app.py
          Compress-Archive -Path dist/MastoSky -DestinationPath MastoSky-Windows-x64.zip -Force

      - name: Build Linux app and portable ZIP
        if: matrix.platform == 'linux'
        run: |
          pyinstaller --noconfirm --clean --onedir \
            --name MastoSky \
            --add-data "index.html:." \
            --add-data "app.js:." \
            --add-data "app.css:." \
            --add-data "manifest.json:." \
            --add-data "brand:brand" \
            --add-data "vendor:vendor" \
            app.py
          tar -czf MastoSky-Linux-x64.tar.gz -C dist MastoSky

          mkdir -p portable/MastoSky
          cp app.py index.html app.js app.css manifest.json MastoSky.bat MastoSky.command LICENSE README.md README.pt.md portable/MastoSky/
          cp -r brand vendor portable/MastoSky/
          chmod +x portable/MastoSky/MastoSky.command
          (cd portable && zip -r ../MastoSky-portable.zip MastoSky)

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.platform }}
          path: |
            MastoSky-macOS.zip
            MastoSky-Windows-x64.zip
            MastoSky-Linux-x64.tar.gz
            MastoSky-portable.zip
          if-no-files-found: ignore

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "MastoSky $TAG" --generate-notes
          fi
          gh release upload "$TAG" artifacts/* --clobber
